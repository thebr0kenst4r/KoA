<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholastic Compilation Pending</title>
    
    <style>
        /* ======================================================================
           STYLE SYSTEM - ALIGNED WITH V4 TEMPLATE GUIDE
           Author & Design Credit: K16103.The Winged Cradler.AMod
           ====================================================================== */
        :root {
            --space: #020912;
            --space2: #05101e;
            --panel: #0a1b30;
            --panel2: #0e2440;
            --panel3: #153258;
            --gold: #d8ad4c;
            --gold-glow: rgba(216, 173, 76, 0.25);
            --cyan: #41d5ff;
            --cyan-glow: rgba(65, 213, 255, 0.25);
            --lunar: #8877ff;
            --lunar-glow: rgba(136, 119, 255, 0.25);
            --silver: #d8d8d8;
            --text-muted: #8fa0b5;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--space);
            color: var(--silver);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #constructionWrapper {
            width: 100%;
            max-width: 500px;
            perspective: 1000px;
        }

        /* DYNAMIC REALM COLORS mapped from parent interface query parameters */
        .theme-universal { --theme-color: var(--cyan); --theme-glow: var(--cyan-glow); }
        .theme-solar { --theme-color: var(--gold); --theme-glow: var(--gold-glow); }
        .theme-lunar { --theme-color: var(--lunar); --theme-glow: var(--lunar-glow); }

        .card {
            background-color: var(--panel);
            border: 1px solid var(--panel3);
            border-radius: 8px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* Top glowing theme strip */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, var(--theme-color, var(--cyan)) 50%, transparent 100%);
            box-shadow: 0 0 12px var(--theme-color, var(--cyan));
        }

        /* Mechanical Gears animation */
        .icon-container {
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 80px;
            height: 80px;
        }

        .gear-primary {
            width: 60px;
            height: 60px;
            fill: var(--theme-color, var(--cyan));
            filter: drop-shadow(0 0 8px var(--theme-glow, var(--cyan-glow)));
            animation: spinClockwise 12s linear infinite;
            transition: fill 0.3s ease, filter 0.3s ease;
        }

        .gear-secondary {
            width: 32px;
            height: 32px;
            fill: var(--text-muted);
            position: absolute;
            top: 6px;
            right: 2px;
            animation: spinCounterClockwise 8s linear infinite;
            opacity: 0.8;
        }

        @keyframes spinClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinCounterClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--theme-color, var(--cyan));
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 0 10px var(--theme-glow, var(--cyan-glow));
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--silver);
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 13.5px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .realm-highlight {
            color: var(--theme-color, var(--cyan));
            font-weight: bold;
            transition: color 0.3s ease;
            text-transform: capitalize;
        }

        /* Citadel Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: var(--space2);
            border: 1px solid var(--panel3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            color: var(--theme-color, var(--cyan));
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .pulse-light {
            width: 8px;
            height: 8px;
            background-color: var(--theme-color, var(--cyan));
            border-radius: 50%;
            box-shadow: 0 0 8px var(--theme-color, var(--cyan));
            animation: pulseGlow 1.5s infinite alternate;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.85); opacity: 0.5; }
            100% { transform: scale(1.15); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="constructionWrapper" class="theme-universal">
        <div class="card">
            
            <!-- Animated Gears Block -->
            <div class="icon-container">
                <!-- Large primary structural gear -->
                <svg class="gear-primary" viewBox="0 0 24 24">
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                </svg>
                <!-- Small companion structural gear -->
                <svg class="gear-secondary" viewBox="0 0 24 24">
                    <path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/>
                </svg>
            </div>

            <!-- Warning Information -->
            <h1>Avalon Scholastic Archive</h1>
            <h2>Manual Under Construction</h2>
            <p>
                This tactical strategy manuscript is currently undergoing intensive validation by our scribes. Tactical logs and structures are being compiled for the <span id="realmName" class="realm-highlight">universal</span> workspace layout.
            </p>

            <!-- Dynamic compilation status -->
            <div class="status-badge">
                <span class="pulse-light"></span>
                <span id="statusLabel">Compiling Database Record</span>
            </div>
        </div>
    </div>

    <!-- URL Parameter Listening to Auto-Adapt Theme -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const realm = params.get('realm') || 'universal';
            
            // Apply corresponding theme
            const wrapper = document.getElementById('constructionWrapper');
            if (wrapper) {
                wrapper.className = 'theme-' + realm;
            }

            // Update text node
            const realmNameText = document.getElementById('realmName');
            if (realmNameText) {
                realmNameText.textContent = realm;
            }
        });
    </script>
</body>
</html>
