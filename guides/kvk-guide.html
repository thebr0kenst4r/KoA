</h2>

<p>

The Excalibur Invasion battlefield is built around five strategic objectives:
Avalon and the four surrounding Towers. While Avalon determines victory,

    border-bottom:none;

}

.guide-table tbody tr:hover{

    background:rgba(255,255,255,.03);

}



/*********************************************
GRID LAYOUTS
**********************************************/

.guide-grid{

    display:grid;

    gap:14px;

    margin:18px 0;

}



.guide-two-column{

    display:grid;

    grid-template-columns:1fr;

    gap:14px;

    margin:18px 0;

}



@media(min-width:900px){

    .guide-two-column{

        grid-template-columns:1fr 1fr;

    }

}

/*********************************************
HERO CARD
**********************************************/

.guide-hero{

    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    margin:18px 0;
}

.hero-header{

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
}

.hero-name{

    color:var(--accent2);
    font-size:1.1rem;
    font-weight:700;
}

.hero-type{

    color:var(--accent);
    font-size:.78rem;
    text-transform:uppercase;
    font-weight:700;

}

/*********************************************
BADGES
**********************************************/

.guide-badge{

    display:inline-block;

    padding:4px 9px;

    border-radius:5px;

    font-size:.72rem;

    font-weight:700;

}



.badge-inf{

    background:#153149;

    color:#38bdf8;

}



.badge-cav{

    background:#3b2b10;

    color:#fb923c;

}



.badge-bow{

    background:#2a1839;

    color:#c084fc;

}



/*********************************************
RELATED GUIDES
**********************************************/

#relatedGuides{

    margin-top:22px;

}



.related-grid{

    display:grid;

    gap:10px;

}



.related-guide{

    display:block;

    padding:12px;

    border-radius:10px;

    background:var(--surface2);

    border:1px solid var(--border);

    color:var(--accent);

    font-weight:700;

    transition:var(--transition);

}



.related-guide:hover{

    border-color:var(--accent);

    transform:translateY(-2px);

}



/*********************************************
FOOTER
**********************************************/

#guideFooter{

    margin-top:24px;

    border-top:2px solid var(--accent);

    padding:14px;

}



.guide-footer{

    display:flex;

    flex-direction:column;

    gap:5px;

    color:var(--muted);

    text-align:center;

}



/*********************************************
HELPERS
**********************************************/

.center{

    text-align:center;

}



.right{

    text-align:right;

}



.bold{

    font-weight:700;

}



.hidden{

    display:none!important;

}



.small{

    font-size:.85rem;

}

/*********************************************
RESPONSIVE
**********************************************/

@media (max-width:900px){

    #guideApp{

        padding:8px;

    }

    #guideHeader{

        padding:14px;

    }

    #guideHeader h1{

        font-size:1.55rem;

    }

    #realmSelector{

        flex-wrap:wrap;

    }

    #realmSelector button{

        min-width:120px;

    }

    .guide-tab{

        padding:10px 14px;

        font-size:.82rem;

    }

    #guideContent{

        padding:14px;

    }

    .section-title{

        font-size:1.35rem;

    }

}



@media (max-width:600px){

    #guideHeader{

        margin-bottom:8px;

    }

    #guideHeader h1{

        font-size:1.25rem;

    }

    .guide-card,

    .guide-info,

    .guide-success,

    .guide-warning,

    .guide-note,

    .guide-hero{

        padding:12px;

    }

    .guide-table th,

    .guide-table td{

        padding:8px;

        font-size:.82rem;

    }

}



/*********************************************
IMAGES
**********************************************/

.guide-image{

    display:block;

    max-width:100%;

    height:auto;

    margin:18px auto;

    border-radius:10px;

    border:1px solid var(--border);

}



.image-caption{

    margin-top:8px;

    color:var(--muted);

    text-align:center;

    font-size:.82rem;

}



/*********************************************
CODE
**********************************************/

pre{

    overflow-x:auto;

    padding:14px;

    border-radius:10px;

    background:var(--surface2);

    border:1px solid var(--border);

    margin:18px 0;

}



code{

    font-family:

        Consolas,

        monospace;

}



/*********************************************
CHECKLIST
**********************************************/

.guide-checklist{

    list-style:none;

    padding:0;

    margin:16px 0;

}



.guide-checklist li{

    position:relative;

    padding:8px 0 8px 28px;

}



.guide-checklist li::before{

    content:"✓";

    position:absolute;

    left:8px;

    color:var(--success);

    font-weight:700;

}



/*********************************************
ANIMATIONS
**********************************************/

.guide-card,

.guide-info,

.guide-success,

.guide-warning,

.guide-note,

.related-guide,

.guide-tab,

#realmSelector button{

    transition:

        background-color .18s ease,

        color .18s ease,

        border-color .18s ease,

        transform .18s ease,

        box-shadow .18s ease;

}



.guide-card:hover,

.guide-hero:hover{

    box-shadow:

        0 4px 12px rgba(0,0,0,.22);

}



/*********************************************
SCROLLBARS
**********************************************/

::-webkit-scrollbar{

    width:10px;

    height:10px;

}



::-webkit-scrollbar-track{

    background:#12192a;

}



::-webkit-scrollbar-thumb{

    background:var(--border);

    border-radius:10px;

}



::-webkit-scrollbar-thumb:hover{

    background:var(--accent);

}



/*********************************************
ACCESSIBILITY
**********************************************/

button:focus-visible,

a:focus-visible{

    outline:2px solid var(--accent);

    outline-offset:2px;

}



::selection{

    background:var(--accent);

    color:#fff;

}



/*********************************************
PRINT
**********************************************/

@media print{

    #realmSelector,

    #tabBar,

    #relatedGuides,

    #guideFooter{

        display:none!important;

    }

}

/*********************************************
TEXT FORMATTING
**********************************************/

/* Standard text colors */

.white{

    color:#ffffff;

}

.gray{

    color:var(--muted);

}

.gold{

    color:#ffcc00;

}

.blue{

    color:#38bdf8;

}

.purple{

    color:#c084fc;

}

.green{

    color:#22c55e;

}

.red{

    color:#ef4444;

}

/* Common emphasis */

.small{

    font-size:.85rem;

}

.large{

    font-size:1.2em;

}

.bold{

    font-weight:700;

}

.italic{

    font-style:italic;

}

.uppercase{

    text-transform:uppercase;

}

.center{

    text-align:center;

}

.right{

    text-align:right;

}



/* Quick utility */

.hidden{

    display:none!important;

}

/*********************************************
END CSS
**********************************************/

</style>
